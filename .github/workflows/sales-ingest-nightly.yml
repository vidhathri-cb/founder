name: sales-ingest (nightly)

# Free scheduling path (2026-09-06 decision: no paid Render/hosting plans --
# Render Cron Jobs have no free tier at all, confirmed against Render's own
# pricing page, so this runs on GitHub Actions instead, which is free for
# this repo well within its private-repo quota). See founder/README.md.

on:
  schedule:
    - cron: "0 20 * * *"   # 20:00 UTC = 1:30 AM IST, nightly
  workflow_dispatch: {}    # lets you trigger a run manually from the Actions tab

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r apps/sales-ingest/requirements.txt
      - name: Run sales-ingest
        working-directory: apps/sales-ingest
        run: python main.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
